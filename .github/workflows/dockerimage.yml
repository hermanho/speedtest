name: Docker Image CI

on:
  push:
    branches: [ node, node-old ]

env:
  REPOSITORY_URI: hermanho/speedtest-node
  
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "IMAGE_TAG=${GITHUB_REF##*/}-${GITHUB_SHA::8}" >> $GITHUB_ENV

    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Update tagging
      if: startsWith(github.ref, 'ref/head/v')
      run: |
        echo "GIT_DESCRIBE=$(git describe)" >> $GITHUB_ENV
        echo "IMAGE_TAG=$GIT_DESCRIBE-${GITHUB_SHA::8}" >> $GITHUB_ENV

    - name: Build and push
      if: github.event_name != 'pull_request' || github.event.action != 'closed' 
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: |
          ${{ env.REPOSITORY_URI }}:latest
          ${{ env.REPOSITORY_URI }}:${{ env.IMAGE_TAG }}
          ghcr.io/${{ env.REPOSITORY_URI }}:latest
          ghcr.io/${{ env.REPOSITORY_URI }}:${{ env.IMAGE_TAG }}
